name: modeling workflow
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: python3 -m unittest discover -s tests/workflow -v
