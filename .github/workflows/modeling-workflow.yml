name: modeling workflow
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: python3 -m unittest discover -s tests/workflow -v
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .agents/skills/mathmodel-workflow/assets/figures/requirements.txt
      - name: Generate real scientific figures (visual review remains manual)
        run: python scripts/demo-publication.py --project /tmp/publication-demo --destination /tmp/publication-delivery
      - name: Retain figures for inspection
        uses: actions/upload-artifact@v4
        with:
          name: publication-figures
          path: /tmp/publication-demo/figures/
          if-no-files-found: error
